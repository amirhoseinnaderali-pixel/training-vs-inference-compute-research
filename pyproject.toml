[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-vs-inference-compute-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
